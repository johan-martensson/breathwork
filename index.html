<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Breathwork">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Breathwork</title>
</head>
<body>
  <main id="home">
    <h1>Breathwork</h1>

    <button id="start" class="start" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7a2.5 2.5 0 1 1-2.5 2.5"/></svg>
      Start session
    </button>
    <p class="footnote" id="estimate"></p>

    <h2>Session</h2>
    <section class="card">
      <div class="row">
        <span>Rounds: <b data-value="rounds"></b></span>
        <div class="stepper">
          <button type="button" data-key="rounds" data-step="-1" aria-label="Fewer rounds">−</button>
          <button type="button" data-key="rounds" data-step="1" aria-label="More rounds">+</button>
        </div>
      </div>
      <div class="row">
        <span>Breaths per round: <b data-value="breaths"></b></span>
        <div class="stepper">
          <button type="button" data-key="breaths" data-step="-1" aria-label="Fewer breaths">−</button>
          <button type="button" data-key="breaths" data-step="1" aria-label="More breaths">+</button>
        </div>
      </div>
      <div class="row">
        <div class="segmented" role="radiogroup" aria-label="Pace">
          <button type="button" data-pace="slow" role="radio">Slow</button>
          <button type="button" data-pace="medium" role="radio">Medium</button>
          <button type="button" data-pace="fast" role="radio">Fast</button>
        </div>
      </div>
      <div class="row">
        <span>Recovery hold: <b data-value="recovery"></b> s</span>
        <div class="stepper">
          <button type="button" data-key="recovery" data-step="-1" aria-label="Shorter recovery hold">−</button>
          <button type="button" data-key="recovery" data-step="1" aria-label="Longer recovery hold">+</button>
        </div>
      </div>
      <label class="row">
        <span>Voice guidance</span>
        <input type="checkbox" id="voice" class="switch">
      </label>
    </section>

    <h2>Progress</h2>
    <section class="card" id="progress"></section>

    <section class="card note">
      Practice sitting or lying down. Never do breathing exercises in or near water, while driving,
      or anywhere fainting could be dangerous.
    </section>
  </main>

  <div id="session" hidden data-phase="idle">
    <header>
      <span id="roundLabel"></span>
      <button type="button" id="close" class="icon-btn" aria-label="End session">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="stage" id="stage">
      <div class="orb-wrap">
        <div class="ring"></div>
        <div class="orb" id="orb">
          <div class="layer breathe"></div>
          <div class="layer hold"></div>
          <div class="layer recover"></div>
        </div>
        <div class="big" id="big"></div>
      </div>
      <p class="instruction" id="instruction"></p>
      <button type="button" id="breatheIn" class="pill">Breathe in</button>
    </div>

    <div class="summary" id="summary" hidden>
      <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
      <h2>Well done</h2>
      <div class="card" id="summaryList"></div>
      <button type="button" id="done" class="pill">Done</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
