<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Breathwork">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Breathwork</title>
  <meta name="description" content="Guidade andningsövningar med röstguidning, andningsljud och tidtagning av andningsuppehåll. Gratis, ingen inloggning – fungerar direkt i mobilen.">

  <!-- Link previews (Facebook, Messenger, LinkedIn, iMessage, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Breathwork">
  <meta property="og:url" content="https://johan-martensson.github.io/breathwork/">
  <meta property="og:title" content="Breathwork – guidade andningsövningar">
  <meta property="og:description" content="Djupandning i takt med en animerad cirkel, andningsuppehåll med tidtagning och röstguidning på svenska. Gratis och utan inloggning.">
  <meta property="og:image" content="https://johan-martensson.github.io/breathwork/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Breathwork – guidade andningsövningar direkt i mobilen">
  <meta property="og:locale" content="sv_SE">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <main id="home">
    <h1>Breathwork</h1>

    <button id="start" class="start" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7a2.5 2.5 0 1 1-2.5 2.5"/></svg>
      <span data-i18n="start"></span>
    </button>
    <p class="footnote" id="estimate"></p>

    <h2 data-i18n="session"></h2>
    <section class="card">
      <div class="row">
        <span><span data-i18n="rounds"></span> <b data-value="rounds"></b></span>
        <div class="stepper">
          <button type="button" data-key="rounds" data-step="-1" aria-label="−">−</button>
          <button type="button" data-key="rounds" data-step="1" aria-label="+">+</button>
        </div>
      </div>
      <div class="row">
        <span><span data-i18n="breaths"></span> <b data-value="breaths"></b></span>
        <div class="stepper">
          <button type="button" data-key="breaths" data-step="-1" aria-label="−">−</button>
          <button type="button" data-key="breaths" data-step="1" aria-label="+">+</button>
        </div>
      </div>
      <div class="row">
        <div class="segmented" role="radiogroup" data-i18n-aria="pace">
          <button type="button" data-pace="slow" role="radio" data-i18n="slow"></button>
          <button type="button" data-pace="medium" role="radio" data-i18n="medium"></button>
          <button type="button" data-pace="fast" role="radio" data-i18n="fast"></button>
        </div>
      </div>
      <div class="row">
        <span><span data-i18n="recovery"></span> <b data-value="recovery"></b> s</span>
        <div class="stepper">
          <button type="button" data-key="recovery" data-step="-1" aria-label="−">−</button>
          <button type="button" data-key="recovery" data-step="1" aria-label="+">+</button>
        </div>
      </div>
      <label class="row">
        <span data-i18n="voice"></span>
        <input type="checkbox" id="voice" class="switch">
      </label>
      <label class="row">
        <span data-i18n="sounds"></span>
        <input type="checkbox" id="sounds" class="switch">
      </label>
      <label class="row">
        <span data-i18n="music"></span>
        <input type="checkbox" id="music" class="switch">
      </label>
      <div class="row">
        <span data-i18n="language"></span>
        <div class="segmented compact" role="radiogroup" data-i18n-aria="language">
          <button type="button" data-lang="en" role="radio">English</button>
          <button type="button" data-lang="sv" role="radio">Svenska</button>
        </div>
      </div>
    </section>

    <h2 data-i18n="progress"></h2>
    <section class="card" id="progress"></section>

    <section class="card note" data-i18n-html="safety"></section>
    <p class="version" id="version"></p>
  </main>

  <div id="session" hidden data-phase="idle">
    <header>
      <span id="roundLabel"></span>
      <button type="button" id="close" class="icon-btn" data-i18n-aria="end">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="stage" id="stage">
      <div class="orb-wrap">
        <div class="ring"></div>
        <div class="orb" id="orb">
          <div class="layer breathe"></div>
          <div class="layer hold"></div>
          <div class="layer recover"></div>
        </div>
        <div class="big" id="big"></div>
      </div>
      <p class="instruction" id="instruction"></p>
      <button type="button" id="breatheIn" class="pill" data-i18n="breatheInButton"></button>
    </div>

    <div class="summary" id="summary" hidden>
      <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
      <h2 data-i18n="wellDone"></h2>
      <div class="card" id="summaryList"></div>
      <button type="button" id="done" class="pill" data-i18n="done"></button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
